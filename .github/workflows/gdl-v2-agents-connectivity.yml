name: GDL V2 Agents Connectivity Canary

on:
  push:
    branches:
      - gdl-v2-agents-connectivity-canary

permissions:
  contents: read

concurrency:
  group: gdl-v2-agents-connectivity-canary
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Report canary gate
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MESSAGE" == *"[gdl-v2-live]"* ]]; then
            echo "Explicit live canary marker detected."
          else
            echo "No live marker. Paid Agents API step remains disabled."
          fi

  connectivity:
    if: ${{ contains(github.event.head_commit.message, '[gdl-v2-live]') }}
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install canary package
        run: python -m pip install -e .
      - name: Run one non-destructive managed-harness connectivity canary
        env:
          OPENAI_API_KEY: ${{ secrets.GDL_V2_OPENAI_API_KEY }}
        run: python scripts/gdl_v2_agents_connectivity.py --task-class routine --live
