name: GDL V2 Productionization Bootstrap

on:
  push:
    branches:
      - gdl-v2-productionization-bootstrap

permissions:
  contents: read

concurrency:
  group: gdl-v2-productionization-bootstrap
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Report productionization bootstrap gate
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MESSAGE" == *"[gdl-v2-productionization-live]"* ]]; then
            echo "Explicit productionization live marker detected."
          else
            echo "No productionization live marker. Paid managed-Codex step remains disabled."
          fi

  productionize:
    if: ${{ contains(github.event.head_commit.message, '[gdl-v2-productionization-live]') }}
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bootstrap package
        run: python -m pip install -e .
      - name: Dry-run productionization handoff
        run: python scripts/gdl_v2_productionization_bootstrap.py
      - name: Run bounded productionization handoff
        env:
          OPENAI_API_KEY: ${{ secrets.GDL_V2_OPENAI_API_KEY }}
        run: |
          python scripts/gdl_v2_productionization_bootstrap.py \
            --live \
            --output-dir gdl-v2-productionization-artifacts
      - name: Preserve productionization producer evidence
        uses: actions/upload-artifact@v4
        with:
          name: gdl-v2-productionization-evidence
          path: gdl-v2-productionization-artifacts/
          if-no-files-found: error
          retention-days: 7
