name: GDL V2 Orchestrated Handoff Canary

on:
  push:
    branches:
      - gdl-v2-orchestrated-handoff-canary

permissions:
  contents: read

concurrency:
  group: gdl-v2-orchestrated-handoff-canary
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Report orchestrated handoff gate
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MESSAGE" == *"[gdl-v2-orchestrated-live]"* ]]; then
            echo "Explicit orchestrated-handoff live marker detected."
          else
            echo "No live marker. Paid managed-Codex step remains disabled."
          fi

  handoff:
    if: ${{ contains(github.event.head_commit.message, '[gdl-v2-orchestrated-live]') }}
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install canary package
        run: python -m pip install -e .
      - name: Dry-run and validate explicit route
        run: |
          python scripts/gdl_v2_orchestrated_handoff.py \
            .gdl/phase4-orchestrated-canary.json \
            --model gpt-6-luna \
            --reasoning-effort max
      - name: Run one bounded managed-Codex handoff
        env:
          OPENAI_API_KEY: ${{ secrets.GDL_V2_OPENAI_API_KEY }}
        run: |
          python scripts/gdl_v2_orchestrated_handoff.py \
            .gdl/phase4-orchestrated-canary.json \
            --model gpt-6-luna \
            --reasoning-effort max \
            --output-dir gdl-v2-orchestrated-artifacts \
            --live
      - name: Preserve independently verified handoff evidence
        uses: actions/upload-artifact@v4
        with:
          name: gdl-v2-orchestrated-handoff-evidence
          path: gdl-v2-orchestrated-artifacts/
          if-no-files-found: error
          retention-days: 7
