name: Bug report
description: Report a reproducible problem without sharing secrets.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste real tokens, credentials, private endpoints, or complete production config files.
  - type: input
    id: version
    attributes:
      label: Codex Config Guard version
      placeholder: 0.2.1
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: 3.13
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS / platform
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Use synthetic paths/values if needed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Redact sensitive values.
    validations:
      required: true
  - type: textarea
    id: minimal
    attributes:
      label: Minimal synthetic reproduction
      description: Please use fake values only.
      render: toml
