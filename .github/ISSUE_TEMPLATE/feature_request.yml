name: Feature request
description: Propose a deterministic, evidence-backed improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What recurring Codex configuration problem should this solve?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Link official Codex docs, schema/source, issue, discussion, or reproducible behavior.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Safety boundaries
      options:
        - label: The proposal can remain read-only by default.
        - label: The proposal can avoid printing config values/secrets.
        - label: The proposal does not require executing Codex, MCP servers, hooks, or project code.
